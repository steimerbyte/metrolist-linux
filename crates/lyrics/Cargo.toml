[package]
name = "ml-lyrics"
description = "Lyrics providers (lrclib/kugou) and LRC/TTML parsing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
ml-core.workspace = true
reqwest.workspace = true
url.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
roxmltree = "0.21"
base64 = "0.23"
# Japanese kanji/kana → romaji. 1.4 MiB embedded dictionary; MIT.
kakasi = "0.1"
# Hanzi → pinyin. `plain` only: tone marks are dropped, matching upstream tinypinyin.
pinyin = { version = "0.11", default-features = false, features = ["plain"] }

[dev-dependencies]
tokio.workspace = true
